<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Margalla Trail Explorer</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-overlay">
      <div class="brand">
        <img src="assets/logo.png" alt="Logo" class="logo">
        <h1>Margalla Trail Explorer</h1>
      </div>
      <p>Browse trails. Plan group hikes. Share it on socials.</p>
    </div>
  </header>

  <main class="trail-grid" id="trailGrid">
    <!-- trail cards injected by JS -->
  </main>

  <dialog id="trailModal">
    <button type="button" id="closeModal" class="close-btn">&times;</button>
    <div class="modal-image" id="modalImage"></div>
    <div class="modal-body">
      <h2 id="modalName"></h2>
      <div class="trail-meta" id="modalMeta"></div>
      <p id="modalDesc" class="modal-desc"></p>

      <div class="wildlife-section">
        <h3>Wildlife You Might Spot</h3>
        <ul id="modalWildlife"></ul>
      </div>

      <button type="button" id="planHikeBtn" class="btn btn-primary">Plan a Hike Here</button>
    </div>
  </dialog>

  <dialog id="planModal">
    <button type="button" id="closePlanModal" class="close-btn">&times;</button>
    <div class="modal-body">
      <h2>Plan a Hike</h2>
      <p class="plan-subtitle" id="planTrailName"></p>

      <form id="planForm">
        <label>Date
          <input type="date" id="pDate" required>
        </label>

        <label>Number of People
          <input type="number" id="pPeopleCount" min="1" max="30" value="1" required>
        </label>

        <label>Names (comma separated)
          <input type="text" id="pNames" placeholder="e.g. Umer, Ali, Zara" required>
        </label>

        <div class="weather-box" id="weatherBox">
          <span class="weather-label">Trail Conditions</span>
          <div id="weatherStatus" class="weather-status">Checking weather...</div>
        </div>

        <button type="submit" class="btn btn-primary">Generate Hike Plan</button>
      </form>
    </div>
  </dialog>

  <dialog id="receiptModal">
    <button type="button" id="closeReceiptModal" class="close-btn">&times;</button>
    <div class="modal-body receipt-preview-body">
      <h2>Your Hike Plan</h2>
      <div class="receipt-preview-wrap">
        <canvas id="receiptCanvas"></canvas>
      </div>
      <div class="receipt-actions">
        <button type="button" id="downloadReceiptBtn" class="btn btn-primary">Download</button>
        <button type="button" id="shareReceiptBtn" class="btn btn-secondary">Share</button>
      </div>
      <div class="receipt-actions">
        <button type="button" id="uploadPhotoBtn" class="btn btn-ghost">Use My Own Photo</button>
        <button type="button" id="resetPhotoBtn" class="btn btn-ghost" hidden>Reset to Trail Photo</button>
      </div>
      <input type="file" id="photoUploadInput" accept="image/*" hidden>
    </div>
  </dialog>

  <!-- Hidden receipt template, rendered to image by html2canvas -->
  <div id="receiptTemplate" class="receipt-template">
    <div class="receipt-bg" id="receiptBg"></div>
    <div class="receipt-overlay">

      <div class="receipt-content-top">
        <div class="receipt-info-block">
          <span class="receipt-trail-name" id="rTrailName"></span>
          <span class="receipt-difficulty" id="rDifficulty"></span>
          <span class="receipt-date" id="rDate"></span>
          <div class="receipt-hazard" id="rHazard"></div>
        </div>

        <div class="receipt-names-list">
          <span class="receipt-names-title">Hiking With</span>
          <ul id="rNamesList"></ul>
        </div>
      </div>

      <div class="receipt-brand-bottom">
        <img src="assets/logo-transparent.png" class="receipt-logo" alt="">
        <span class="receipt-brand-text">Made with Margalla Hiking Tracker</span>
      </div>

    </div>
  </div>

  <footer class="site-footer">
    Made by <a href="https://github.com/umexrn" target="_blank" rel="noopener">Umer Nauman</a>
    · <a href="https://github.com/umexrn" target="_blank" rel="noopener">GitHub</a>
    · <a href="https://linkedin.com/in/umexrn" target="_blank" rel="noopener">LinkedIn</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
